name: Apply Org Settings

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
    paths: ['safe-settings/**', 'scripts/apply-org-settings.sh']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List repos and desired state without applying (true/false)'
        required: false
        default: 'false'
        type: boolean

permissions: {}

concurrency:
  group: apply-org-settings
  cancel-in-progress: false

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          min-severity: high

  # Audit job: read-only drift report. Runs on the schedule and on manual
  # dispatch with dry_run=true. No environment, so org-app secrets are not
  # available and the run cannot mutate anything (audit MED-4).
  audit:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    concurrency:
      group: apply-org-settings-audit
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub-hosted runners ship gh; no manual install needed.

      - name: Audit org settings (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: 'true'
        run: |
          chmod +x scripts/apply-org-settings.sh
          scripts/apply-org-settings.sh "$DRY_RUN"

  # Apply job: privileged. Runs on push to main and on manual dispatch with
  # dry_run=false. Uses the org-app environment, which requires review by the
  # @aptu-dev/core team (reviewers added out-of-band).
  # Gate: secrets context is unavailable in job-level if, so probe the
  # environment secret here and expose the result as an output.
  gate:
    runs-on: ubuntu-26.04-arm
    permissions: {}
    # Must declare the environment: environment secrets resolve only for
    # jobs that declare it, and apply's precondition is an environment secret.
    environment: org-app
    outputs:
      apply-configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check apply prerequisites
        id: check
        env:
          HAS_KEY: ${{ secrets.ORG_APP_PRIVATE_KEY != '' }}
        run: echo "configured=$HAS_KEY" >> "$GITHUB_OUTPUT"

  apply:
    # Guard on the App key secret: aptu-dev's org-app environment has no
    # ORG_APP_PRIVATE_KEY configured yet (the App exists, client id
    # Iv1.8d242d6d729752ee, but its key was never stored). Until the key is
    # added, pushes to main skip the apply job instead of failing red; the
    # scheduled read-only audit is unaffected.
    if: >-
      needs.gate.outputs.apply-configured == 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true))
    needs: gate
    environment: org-app
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mint GitHub App token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0 # zizmor: ignore[github-app] scoped via permission-administration, permission-issues, permission-pull-requests, and permission-contents inputs; repo settings updates need repo administration write, label sync needs issues write, community file sync needs contents and pull requests write; org repo listing needs metadata read only (implied by any repository permission)
        id: app-token
        with:
          client-id: ${{ vars.ORG_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_APP_PRIVATE_KEY }}
          owner: aptu-dev
          permission-administration: write
          permission-issues: write
          permission-pull-requests: write
          permission-contents: write

      # GitHub-hosted runners ship gh; no manual install needed.

      - name: Apply org settings
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          chmod +x scripts/apply-org-settings.sh
          scripts/apply-org-settings.sh "$DRY_RUN"
